<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PICKER - Classroom Arcade System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Arcade & Tekken Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Teko:wght@600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Teko', sans-serif;
            background-color: #030108;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(220, 38, 38, 0.3) 0%, transparent 60%),
                radial-gradient(circle at 50% 80%, rgba(30, 10, 60, 0.5) 0%, transparent 70%),
                linear-gradient(to bottom, #07030e, #11051c, #030108);
            color: #ffffff;
            user-select: none;
            overflow: hidden;
            min-height: 100vh;
        }

        .font-arcade { font-family: 'Press Start 2P', cursive; }
        .font-teko { font-family: 'Teko', sans-serif; }
        .font-retro { font-family: 'VT323', monospace; }

        /* CRT Scanlines Overlay */
        .crt-scanlines::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            z-index: 99;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Slanted Tekken 3D Typography */
        .tekken-title {
            font-family: 'Teko', sans-serif;
            font-weight: 700;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 4px;
            transform: skewX(-10deg);
            text-shadow: 
                4px 4px 0px #000,
                -2px -2px 0 #000,  
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000,
                0 0 30px rgba(239, 68, 68, 0.8);
        }

        /* Arcade Buttons */
        .btn-tekken {
            position: relative;
            font-family: 'Press Start 2P', cursive;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #450a0a, 0 10px 20px rgba(0,0,0,0.8);
            transition: all 0.1s ease;
        }

        .btn-tekken:hover {
            filter: brightness(1.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #450a0a, 0 12px 25px rgba(220, 38, 38, 0.4);
        }

        .btn-tekken:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #450a0a, 0 4px 8px rgba(0,0,0,0.8);
        }

        /* Coin Pulse */
        @keyframes coin-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.98); }
        }
        .animate-coin {
            animation: coin-pulse 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="crt-scanlines flex flex-col justify-between items-center p-4 min-h-screen">

    <!-- TOP HEADER BANNER -->
    <header class="w-full max-w-4xl pt-4 text-center">
        <div class="inline-block px-4 py-1 bg-yellow-500 text-black font-arcade text-xs font-bold rounded shadow-lg animate-pulse mb-2">
            ★ SYSTEM SELECT STAGE ★
        </div>
        <p class="font-arcade text-xs text-cyan-400 tracking-widest">CHOOSE YOUR ARCADE VERSION</p>
    </header>

    <!-- MAIN CENTER LANDING CARD -->
    <main class="w-full max-w-xl mx-auto my-auto text-center space-y-8">
        
        <!-- TITLE -->
        <div class="space-y-1">
            <h1 class="tekken-title text-7xl sm:text-9xl text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 via-red-500 to-red-900 leading-none">
                PICKER
            </h1>
            <p class="font-retro text-3xl text-gray-300 tracking-wider">CLASSROOM RECITATION & DRAFT SYSTEM</p>
        </div>

        <!-- BUTTON SELECTION CONTAINER -->
        <div class="bg-gradient-to-b from-red-950/80 via-purple-950/70 to-black/90 p-6 sm:p-8 rounded-3xl border-2 border-red-500 shadow-[0_0_50px_rgba(220,38,38,0.4)] space-y-5">
            
            <!-- BUTTON 1: TEKKEN 1 -->
            <a href="tekken1.html" class="block w-full">
                <button class="btn-tekken w-full bg-gradient-to-r from-red-700 via-red-600 to-red-800 text-white font-bold text-lg sm:text-2xl py-5 rounded-2xl border-2 border-yellow-300 flex items-center justify-center gap-3">
                    <span>🕹️</span>
                    <span>TEKKEN VERSION 1</span>
                </button>
            </a>

            <!-- BUTTON 2: TEKKEN 2 -->
            <a href="tekken2.html" class="block w-full">
                <button class="btn-tekken w-full bg-gradient-to-r from-cyan-700 via-blue-600 to-cyan-800 text-white font-bold text-lg sm:text-2xl py-5 rounded-2xl border-2 border-cyan-300 flex items-center justify-center gap-3">
                    <span>⚔️</span>
                    <span>TEKKEN VERSION 2</span>
                </button>
            </a>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="w-full max-w-4xl pb-4 text-center">
        <p class="font-retro text-2xl text-gray-400 animate-coin">CREDIT(S): 99 • SELECT VERSION TO LAUNCH</p>
    </footer>

</body>
</html>
